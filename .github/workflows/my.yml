name: Update EPG (MY)

on:
  workflow_dispatch:

jobs:
  update-epg-my:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download, Filter & Update MY EPG
        run: |
          curl -L "https://github.com/AqFad2811/epg/raw/refs/heads/main/compressed/epg.xml.gz" -o epg.xml.gz
          curl -L "https://github.com/AqFad2811/epg/raw/refs/heads/main/compressed/rtmklik.xml.gz" -o rtmklik.xml.gz
          
          python3 -c '
          import tarfile
          import gzip
          import os
          import xml.etree.ElementTree as ET

          files = ["epg.xml.gz", "rtmklik.xml.gz"]
          extracted_files = []

          # Ekstrak semua fail yang dimuat turun
          for i, file in enumerate(files):
              extracted_xml = f"source_{i}.xml"
              extracted_files.append(extracted_xml)
              try:
                  with tarfile.open(file, "r:*") as tar:
                      member = next((m for m in tar.getmembers() if m.name.endswith(".xml")), None)
                      if member:
                          f = tar.extractfile(member)
                          with open(extracted_xml, "wb") as out:
                              out.write(f.read())
                      else:
                          raise Exception("Tiada fail XML")
              except Exception:
                  with gzip.open(file, "rb") as f_in, open(extracted_xml, "wb") as f_out:
                      f_out.write(f_in.read())

          CHANNEL_MAP = {
              "DramaHebat": "mastro.dramahebat",
              "FilemMantap": "mastro.filemmantap",
              "JomNgaji": "mastro.jomngaji",
              "LawakSentral": "mastro.lawaksentral",
              "SonyVizha": "mastro.sonyvizha",
              "DramaHotpot": "mastro.dramahotpot",
              "TravelandTaste": "mastro.traveltaste",
              "OhMyCeria": "mastro.ohmyceria",
              "Jr": "mastro.jr",
              "AstroArena": "mastro.arena",
              "AstroStadium": "mastro.arena2",
              "AstroArenaBola": "mastro.arenabola",
              "AstroArenaBola2": "mastro.arenabola2",
              "AstroSportsUHD": "mastro.sportsuhd",
              "AstroGrandstand": "mastro.grandstand",
              "AstroPremierLeague": "mastro.premierleague",
              "AstroPremierLeague2": "mastro.premierleague2",
              "AstroFootball": "mastro.football",
              "AstroBadminton": "mastro.badminton",
              "AstroBadminton2": "mastro.badminton2",
              "AstroSportsPlus": "mastro.sportsplus",
              "AstroSportsPlus2": "mastro.sportsplus2",
              "Sukan+": "mastro.sukanplus"
          }

          new_root = None

          # Proses dan gabungkan semua fail XML yang telah diekstrak
          for xml_file in extracted_files:
              tree = ET.parse(xml_file)
              root = tree.getroot()
              
              if new_root is None:
                  new_root = ET.Element("tv", root.attrib)

              for channel in root.findall("channel"):
                  old_id = channel.get("id")
                  if old_id in CHANNEL_MAP:
                      channel.set("id", CHANNEL_MAP[old_id])
                      new_root.append(channel)

              for programme in root.findall("programme"):
                  old_channel = programme.get("channel")
                  if old_channel in CHANNEL_MAP:
                      programme.set("channel", CHANNEL_MAP[old_channel])
                      new_root.append(programme)

          new_tree = ET.ElementTree(new_root)
          ET.indent(new_tree, space="  ")
          new_tree.write("my.xml", encoding="utf-8", xml_declaration=True)
          '

          rm -f epg.xml.gz rtmklik.xml.gz source_0.xml source_1.xml

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add my.xml
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update my.xml [skip ci]" && git push)
