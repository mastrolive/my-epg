            "https://epg.pw/api/epg.xml?channel_id=5791|mastro.skysportsfootball"
            "https://epg.pw/api/epg.xml?channel_id=538884|mastro.skysportsgolf"
            "https://epg.pw/api/epg.xml?channel_id=7673|mastro.skysportsmainevent"
            "https://epg.pw/api/epg.xml?channel_id=6958|mastro.skysportspremierleague"
            "https://epg.pw/api/epg.xml?channel_id=219100|mastro.premiersports1"
            "https://epg.pw/api/epg.xml?channel_id=219104|mastro.premiersports2"
            "https://epg.pw/api/epg.xml?channel_id=543110|mastro.ten1"
            "https://epg.pw/api/epg.xml?channel_id=558519|mastro.sukanplus"
            "https://epg.pw/api/epg.xml?channel_id=400477|mastro.tnt1"
            "https://epg.pw/api/epg.xml?channel_id=400480|mastro.tnt2"
            "https://epg.pw/api/epg.xml?channel_id=400479|mastro.tnt3"
            "https://epg.pw/api/epg.xml?channel_id=400478|mastro.tnt4"
            "https://epg.pw/api/epg.xml?channel_id=465006|mastro.usanetwork"
            "https://epg.pw/api/epg.xml?channel_id=465156|mastro.foxdeportes"
          )

          for item in "${channels[@]}"; do
            url="${item%%|*}"
            custom_id="${item#*|}"
            FILENAME="temp_epg/$(uuidgen).xml"
            
            curl -A "Mozilla/5.0" --connect-timeout 30 --retry 5 --retry-delay 5 -sL "$url" > "$FILENAME"
            
            if [ $(stat -c%s "$FILENAME") -lt 100 ]; then
              rm "$FILENAME"
            else
              sed -i -E "s/channel id=\"[^\"]+\"/channel id=\"$custom_id\"/g" "$FILENAME"
              sed -i -E "s/programme channel=\"[^\"]+\"/programme channel=\"$custom_id\"/g" "$FILENAME"
            fi
            sleep 1.2
          done

          curl -L "https://github.com/apistech/project/raw/refs/heads/main/epgs/guide.xml.gz" -o guide.xml.gz
          gunzip -c guide.xml.gz > source_id.xml
          rm guide.xml.gz

          id_channels=(
            "ANTV.id@SD|mastro.antv"
            "DAAITV.id@SD|mastro.daaitv"
            "GTV.id@SD|mastro.gtv"
            "IMC.id@SD|mastro.imc"
            "Indosiar.id@SD|mastro.indosiar"
            "MDTV.id@HD|mastro.mdtv"
            "MNCTV.id@SD|mastro.mnctv"
            "Moji.id@SD|mastro.moji"
            "NusantaraTV.id@SD|mastro.nusantaratv"
            "RCTI.id@SD|mastro.rcti"
            "RajawaliTV.id@SD|mastro.rtv"
            "SCTV.id@SD|mastro.sctv"
            "TransTV.id@SD|mastro.transtv"
            "Trans7.id@SD|mastro.trans7"
            "TVRI.id@SD|mastro.tvri"
            "VisionPrime.id@SD|mastro.visionprime"
            "ZeeBioskop.id@SD|mastro.zeebioskop"
            "CNBCIndonesia.id@SD|mastro.cnbcid"
            "CNNIndonesia.id@SD|mastro.cnnid"
          )

          for item in "${id_channels[@]}"; do
            orig_id="${item%%|*}"
            custom_id="${item#*|}"
            FILENAME="temp_epg/id_$(uuidgen).xml"

            xmlstarlet sel -t -c "//channel[@id='$orig_id']" source_id.xml > "$FILENAME" 2>/dev/null || true
            xmlstarlet sel -t -c "//programme[@channel='$orig_id']" source_id.xml >> "$FILENAME" 2>/dev/null || true

            if [ -s "$FILENAME" ]; then
              sed -i -E "s/channel id=\"[^\"]+\"/channel id=\"$custom_id\"/g" "$FILENAME"
              sed -i -E "s/programme channel=\"[^\"]+\"/programme channel=\"$custom_id\"/g" "$FILENAME"
            else
              rm "$FILENAME"
            fi
          done
          rm source_id.xml

          curl -L "https://raw.githubusercontent.com/AqFad2811/epg/main/epg.xml" -o source_aqfad.xml

          aqfad_channels=(
            "Astro30|mastro.30"
            "TV1|mastro.tv1"
            "TV2|mastro.tv2"
            "TV3|mastro.tv3"
            "DidikTVKPM|mastro.didiktv"
            "8TV|mastro.8tv"
            "TV9|mastro.tv9"
          )

          for item in "${aqfad_channels[@]}"; do
            orig_id="${item%%|*}"
            custom_id="${item#*|}"
            FILENAME="temp_epg/aqfad_$(uuidgen).xml"

            xmlstarlet sel -t -c "//channel[@id='$orig_id']" source_aqfad.xml > "$FILENAME" 2>/dev/null || true
            xmlstarlet sel -t -c "//programme[@channel='$orig_id']" source_aqfad.xml >> "$FILENAME" 2>/dev/null || true

            if [ -s "$FILENAME" ]; then
              sed -i -E "s/channel id=\"[^\"]+\"/channel id=\"$custom_id\"/g" "$FILENAME"
              sed -i -E "s/programme channel=\"[^\"]+\"/programme channel=\"$custom_id\"/g" "$FILENAME"
            else
              rm "$FILENAME"
            fi
          done
          rm source_aqfad.xml

          echo '<?xml version="1.0" encoding="UTF-8"?>' > epg.xml
          echo '<tv generator-info-name="Gemini-Fixed-EPG">' >> epg.xml
          
          for f in temp_epg/*.xml; do
            sed -n '/<channel/,/<\/channel>/p' "$f" >> epg.xml || true
          done

          for f in temp_epg/*.xml; do
            sed -n '/<programme/,/<\/programme>/p' "$f" | grep -vE '(\?xml|<tv|<\/tv)' >> epg.xml || true
          done
          
          echo '</tv>' >> epg.xml

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          rm -rf temp_epg
          
          git rm mewatch.xml rtmklik.xml vidio.xml indonesia3.xml sooka.xml rctiplus.xml external_epg.xml myepg.xml cignal.xml starhub.xml --ignore-unmatch
          
          git add epg.xml
          
          TIMESTAMP=$(date -u -d "+8 hours" "+%d-%m-%Y %H:%M MYT")
          git commit -m "Update EPG (epg.pw + ID + AqFad): $TIMESTAMP" || exit 0
          git push
