name: Update EPG

on:
  schedule:
    # 23:14 UTC = 07:14 AM MYT
    # 11:14 UTC = 07:14 PM MYT
    - cron: '14 11,23 * * *'
  workflow_dispatch:

jobs:
  grab:
    runs-on: ubuntu-latest
    permissions:
      contents: write

