name: Update EPG (EPG2)

on:
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download, Filter & Update EPG
        run: |
          curl -L "https://epgshare01.online/epgshare01/epg_ripper_AU1.xml.gz" -o au.xml.gz
          curl -L "https://epgshare01.online/epgshare01/epg_ripper_UK1.xml.gz" -o uk.xml.gz
          curl -L "https://epgshare01.online/epgshare01/epg_ripper_MY1.xml.gz" -o my.xml.gz
          curl -L "https://epgshare01.online/epgshare01/epg_ripper_IN1.xml.gz" -o in.xml.gz
          
          # Ekstrak fail gzip
          gunzip -c au.xml.gz > source_au.xml
          gunzip -c uk.xml.gz > source_uk.xml
          gunzip -c my.xml.gz > source_my.xml
          gunzip -c in.xml.gz > source_in.xml
          
          python3 -c '
          import xml.etree.ElementTree as ET

          CHANNEL_MAP = {
              "Disney.International.HD.in": "mastro.disneyinter",
              "Astro.Premier.League.3.my": "mastro.premierleague3",
              "Astro.Premier.League.4.my": "mastro.premierleague4",
              "Astro.Premier.League.5.my": "mastro.premierleague5",
              "beINSports1.au": "mastro.beinsports1au",
              "beINSports2.au": "mastro.beinsports2au",
              "beINSports3.au": "mastro.beinsports3au",
              "SkySp.F1.HD.uk": "mastro.skysportsf1",
              "Sky.Sports.Football.HD.uk": "mastro.skysportsfootball",
              "SkySp.Golf.HD.uk": "mastro.skysportsgolf",
              "SkySpMainEvHD.uk": "mastro.skysportsmainevent",
              "SkySp.PL.HD.uk": "mastro.skysportspremierleague",
              "Premier.Sports.1.HD.uk": "mastro.premiersports1",
              "Premier.Sports.2.HD.uk": "mastro.premiersports2",
              "TNT.Sports.1.HD.uk": "mastro.tnt1",
              "TNT.Sports.2.HD.uk": "mastro.tnt2",
              "TNT.Sports.3.HD.uk": "mastro.tnt3",
              "TNT.Sports.4.HD.uk": "mastro.tnt4"
          }

          # Cipta elemen punca (root element) baharu
          new_root = ET.Element("tv", {"generator-info-name": "MastroTV EPG Tool"})

          # Senarai fail sumber untuk diproses
          sources = ["source_au.xml", "source_uk.xml", "source_my.xml", "source_in.xml"]

          for src in sources:
              try:
                  tree = ET.parse(src)
                  root = tree.getroot()

                  for channel in root.findall("channel"):
                      old_id = channel.get("id")
                      if old_id in CHANNEL_MAP:
                          channel.set("id", CHANNEL_MAP[old_id])
                          new_root.append(channel)

                  for programme in root.findall("programme"):
                      old_channel = programme.get("channel")
                      if old_channel in CHANNEL_MAP:
                          programme.set("channel", CHANNEL_MAP[old_channel])
                          new_root.append(programme)
              except Exception as e:
                  print(f"Ralat semasa memproses {src}: {e}")

          new_tree = ET.ElementTree(new_root)
          ET.indent(new_tree, space="  ")
          new_tree.write("epg2.xml", encoding="utf-8", xml_declaration=True)
          '

          # Bersihkan fail sementara
          rm -f au.xml.gz uk.xml.gz my.xml.gz in.xml.gz source_au.xml source_uk.xml source_my.xml source_in.xml

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add epg2.xml
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update epg2.xml [skip ci]" && git push)
